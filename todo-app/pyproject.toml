[project]
name = "flask-todo-app"
version = "0.1.0"
description = "A minimal Flask To-Do web app using AWS DynamoDB"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "boto3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "moto",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "moto",
    "requests",
]

# 👇 Added section to tell Hatchling what to include in the wheel
[tool.hatch.build.targets.wheel]
include = ["app.py", "tests"]
