---
AWSTemplateFormatVersion: '2010-09-09'

Description: "Setup an application loadbalancer."

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "The ID of the VPC to deploy into."
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "A comma-separated list of at least two public subnet IDs"
  HostedZoneId:
    Description: "The ID of the Hosted Zone for the domain in Route 53 (e.g., Z0123456789ABCDEFGHIJ)."
    Type: String
  AcmCertificateArn:
    Type: String
    Description: "The ARN of the ACM certificate for the load balancer."
  DomainName:
    Description: "The Domain Name"
    Type: String

  ContainerPort:
    Type: Number
    Default: 5000
  LoadBalancerPort:
    Type: Number
    Default: 443

Resources:

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['', [!Ref ProjectName, LoadBalancerSecurityGroup]]
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref LoadBalancerPort
          ToPort: !Ref LoadBalancerPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-internet-facing"
      LoadBalancerAttributes:
        # this is the default, but is specified here in case it needs to be changed
        - Key: idle_timeout.timeout_seconds
          Value: 60
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: project
          Value: !Ref ProjectName

  DefaultTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: "5"
      HealthCheckPath: "/"
      HealthCheckPort: 'traffic-port'
      HealthCheckProtocol: "HTTP"
      HealthCheckTimeoutSeconds: "2"
      HealthyThresholdCount: "2"
      Matcher:
        HttpCode: "200"
      Name: !Sub "${ProjectName}-default"
      Port: !Ref ContainerPort
      Protocol: "HTTP"
      TargetType: ip
      UnhealthyThresholdCount: "2"
      VpcId: !Ref VpcId

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DefaultTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: "443"
      Protocol: "HTTPS"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: "redirect"
          RedirectConfig:
            Protocol: "HTTPS"
            Port: 443
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: "HTTP_301"
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: "HTTP"

  DNSRecord:
    Type: AWS::Route53::RecordSet
    DependsOn: [ ApplicationLoadBalancer ]
    Properties:
      Comment: DNS name for load balancer
      Name: !Sub "${DomainName}."
      HostedZoneId: !Ref HostedZoneId
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName

Outputs:
  ListenerId:
    Value: !Ref Listener
    Export:
      Name: !Sub "${AWS::StackName}:Listener"
  LoadBalancerFullName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub "${AWS::StackName}:LoadBalancerFullName"
  DefaultTargetGroup:
      Value: !Ref DefaultTargetGroup
      Export:
        Name: !Sub "${AWS::StackName}:DefaultTargetGroup"

